<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F6F3EC" id="meta-theme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="大小事">
<meta name="format-detection" content="telephone=no">
<title>我想干的大小事</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<script>
  /* 提前应用主题，避免刷新时闪白 */
  try {
    var saved = JSON.parse(localStorage.getItem('wishlist.settings.v1') || '{}');
    var mode = saved.theme || 'auto';
    var isDark = mode === 'dark' || (mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
  } catch (e) {}
</script>
<style>
  :root {
    --bg: #F6F3EC;
    --surface: #FFFFFF;
    --surface-2: #FBF7F0;
    --ink: #221D18;
    --ink-2: #4C4239;
    --muted: #7C7165;
    --line: #E8E0D3;
    --line-strong: #D8CEBE;
    --accent: #F2623C;
    --accent-2: #E2A93B;
    --accent-ink: #AE3A1D;
    --accent-soft: #FCE7DF;
    --gold-soft: #FAEFD8;
    --gold-ink: #8A6414;
    --danger: #C94132;
    --danger-soft: #FBE9E5;
    --green: #3E9B6B;
    --shadow-card: 0 14px 30px -26px rgba(61, 38, 20, .55);
    --shadow-float: 0 18px 40px -18px rgba(61, 38, 20, .38);
    --r-card: 20px;
  }

  html[data-theme="dark"] {
    --bg: #141210;
    --surface: #211D19;
    --surface-2: #1A1714;
    --ink: #F4EDE3;
    --ink-2: #D9D0C4;
    --muted: #A2968A;
    --line: #302A24;
    --line-strong: #453C33;
    --accent: #FF7A52;
    --accent-2: #E9B45C;
    --accent-ink: #FFB49B;
    --accent-soft: #3A231B;
    --gold-soft: #332A1B;
    --gold-ink: #E9C079;
    --danger: #FF8C7A;
    --danger-soft: #3A211D;
    --green: #6BC79A;
    --shadow-card: 0 18px 34px -26px rgba(0, 0, 0, .9);
    --shadow-float: 0 20px 44px -18px rgba(0, 0, 0, .85);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html {
    -webkit-text-size-adjust: 100%;
    scrollbar-gutter: stable;
  }
  html[data-theme="light"] { color-scheme: light; }
  html[data-theme="dark"] { color-scheme: dark; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC",
      "HarmonyOS Sans SC", "MiSans", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(900px 420px at 108% -6%, rgba(242, 98, 60, .13), transparent 62%),
      radial-gradient(760px 400px at -12% 4%, rgba(226, 169, 59, .12), transparent 58%),
      var(--bg);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
  }
  body.sheet-open { overflow: hidden; }

  button, input, textarea, select { font: inherit; color: inherit; }
  button {
    padding: 0; border: 0; background: none; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  input, textarea { -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  ::selection { background: var(--accent); color: #fff; }
  .hidden { display: none !important; }

  .app {
    max-width: 620px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 18px 152px;
  }

  /* ---------- 顶部 ---------- */
  .brand-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo {
    flex: 0 0 auto;
    width: 38px; height: 38px; border-radius: 12px;
    display: grid; place-items: center;
    background: linear-gradient(140deg, #FF9468, #EB502C);
    color: #FFF7EC; font-size: 21px; font-weight: 800; line-height: 1;
    box-shadow: 0 8px 18px -10px rgba(235, 80, 44, .9), inset 0 1px 0 rgba(255, 255, 255, .35);
    text-shadow: 0 1px 2px rgba(130, 30, 10, .35);
  }
  .brand-meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .brand-meta .date { font-size: 12.5px; font-weight: 650; color: var(--ink-2); letter-spacing: .01em; }
  .brand-meta .eyebrow { font-size: 8.5px; font-weight: 700; letter-spacing: .18em; color: var(--muted); }

  .top-actions { display: flex; gap: 8px; flex: 0 0 auto; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--ink-2);
    box-shadow: 0 4px 12px -8px rgba(61, 38, 20, .5);
    transition: transform .16s ease, background .2s ease;
  }
  .icon-btn:active { transform: scale(.92); }
  .icon-btn svg { width: 19px; height: 19px; }
  .icon-sun { display: none; }
  [data-theme="dark"] .icon-sun { display: block; }
  [data-theme="dark"] .icon-moon { display: none; }

  .title {
    margin: 18px 0 0;
    font-size: clamp(28px, 8.4vw, 34px);
    line-height: 1.16;
    font-weight: 800;
    letter-spacing: -.02em;
  }
  .title .hl {
    background: linear-gradient(100deg, var(--accent) 10%, var(--accent-2) 92%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  .tagline {
    margin: 8px 0 0;
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.6;
  }
  .tagline .spark { color: var(--accent); font-size: 12px; }

  /* ---------- 总览卡 ---------- */
  .summary {
    position: relative;
    margin-top: 18px;
    padding: 16px;
    border-radius: 24px;
    display: flex; align-items: center; gap: 14px;
    color: #FBF5EA;
    background:
      radial-gradient(140px 140px at 102% -10%, rgba(242, 98, 60, .55), transparent 70%),
      linear-gradient(140deg, #2C241C 0%, #1D1813 100%);
    box-shadow: 0 22px 40px -28px rgba(40, 24, 12, .85);
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, .055);
  }
  [data-theme="dark"] .summary { border-color: rgba(255, 255, 255, .09); }
  .ring { position: relative; flex: 0 0 auto; width: 64px; height: 64px; }
  .ring svg { width: 64px; height: 64px; display: block; }
  .ring-progress { stroke-dasharray: 163.36; stroke-dashoffset: 163.36; transition: stroke-dashoffset .7s cubic-bezier(.22, .9, .24, 1); }
  .ring-pct {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 13px; font-weight: 750; letter-spacing: .01em;
    font-variant-numeric: tabular-nums;
  }
  .summary-copy { min-width: 0; }
  .summary-main {
    margin: 0;
    font-size: 13px;
    color: rgba(251, 245, 234, .72);
    display: flex; align-items: baseline; gap: 3px;
    letter-spacing: .01em;
  }
  .summary-main strong { font-size: 23px; font-weight: 800; color: #FBF5EA; line-height: 1; }
  .summary-main .slash { opacity: .4; margin: 0 1px; }
  .summary-sub {
    margin: 6px 0 0;
    font-size: 11.5px;
    color: rgba(251, 245, 234, .62);
    line-height: 1.5;
  }
  .summary-star {
    position: absolute; right: 10px; bottom: -14px;
    font-size: 64px; color: rgba(255, 255, 255, .055);
    transform: rotate(12deg);
    pointer-events: none;
  }

  /* ---------- 列表工具条 ---------- */
  .section-head {
    margin-top: 26px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .section-title {
    display: flex; align-items: center; gap: 7px;
    min-width: 0;
    font-size: 14.5px; font-weight: 750; letter-spacing: -.01em;
    white-space: nowrap;
  }
  .count-pill {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 22px; height: 19px; padding: 0 6px;
    border-radius: 99px;
    background: var(--surface-2); border: 1px solid var(--line);
    color: var(--muted);
    font-size: 10.5px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .head-actions { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  .mini-btn {
    width: 34px; height: 32px; border-radius: 10px;
    display: grid; place-items: center;
    color: var(--muted);
    transition: background .18s, color .18s;
  }
  .mini-btn:hover { background: var(--surface-2); color: var(--ink); }
  .mini-btn svg { width: 17px; height: 17px; }
  .sort-btn {
    display: flex; align-items: center; gap: 4px;
    height: 32px; padding: 0 9px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    font-size: 11.5px; font-weight: 600;
    transition: .18s;
  }
  .sort-btn:active { transform: scale(.96); }
  .sort-btn svg { width: 13px; height: 13px; opacity: .8; }

  .cat-row {
    display: flex; gap: 7px;
    margin: 12px -18px 0;
    padding: 0 18px 2px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .cat-row::-webkit-scrollbar { display: none; }
  .cat-row:empty { display: none; }
  .cat-chip {
    flex: 0 0 auto;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    font-size: 12px; font-weight: 600;
    white-space: nowrap;
    transition: .16s;
  }
  .cat-chip.active {
    background: var(--ink); border-color: var(--ink); color: var(--bg);
    box-shadow: 0 6px 14px -10px rgba(0, 0, 0, .6);
  }

  .search-row {
    display: none;
    align-items: center; gap: 8px;
    margin-top: 12px;
    padding: 0 12px;
    height: 44px;
    border-radius: 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-card);
  }
  .search-row.show { display: flex; animation: slideDown .22s ease both; }
  .search-row .search-ico { width: 17px; height: 17px; color: var(--muted); flex: 0 0 auto; }
  .search-row input {
    flex: 1; min-width: 0;
    border: 0; outline: 0; background: transparent;
    font-size: 16px;
  }
  .search-row input::placeholder { color: var(--muted); }
  .search-row input::-webkit-search-cancel-button { display: none; }
  .search-clear {
    width: 26px; height: 26px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--surface-2);
    color: var(--muted);
    font-size: 17px; line-height: 1;
  }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

  /* ---------- 卡片 ---------- */
  .list { display: grid; gap: 10px; margin-top: 12px; }

  .item {
    position: relative;
    display: flex; gap: 11px;
    padding: 14px 14px 13px 13px;
    border-radius: var(--r-card);
    background: var(--surface);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-card);
    transition: box-shadow .2s, border-color .2s, opacity .2s;
  }
  .item::before {
    content: "";
    position: absolute; left: 0; top: 18px; bottom: 18px;
    width: 3px; border-radius: 0 3px 3px 0;
    background: transparent;
  }
  .item[data-prio="high"]::before { background: linear-gradient(var(--accent), #FF9A5A); }
  .item[data-prio="mid"]::before { background: var(--accent-2); opacity: .55; }
  .item[data-status="paused"] { opacity: .74; }
  .item[data-status="done"] { background: var(--surface-2); box-shadow: none; }
  @media (hover: hover) {
    .item:hover { border-color: var(--line-strong); box-shadow: 0 16px 32px -24px rgba(61, 38, 20, .55); }
  }

  .check {
    flex: 0 0 auto;
    width: 26px; height: 26px;
    margin-top: 1px;
    border-radius: 50%;
    border: 1.8px solid var(--line-strong);
    background: var(--surface);
    display: grid; place-items: center;
    transition: background .2s, border-color .2s, transform .15s;
  }
  .check:active { transform: scale(.88); }
  .check svg {
    width: 14px; height: 14px;
    fill: none; stroke: #fff; stroke-width: 3;
    stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 26; stroke-dashoffset: 26;
    transition: stroke-dashoffset .24s ease .04s;
  }
  .item[data-cycle]:not([data-cycle="once"]) .check { border-style: dashed; }
  .item[data-status="done"] .check {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-color: transparent; border-style: solid;
  }
  .item[data-status="done"] .check svg { stroke-dashoffset: 0; }

  .item-main { flex: 1; min-width: 0; cursor: pointer; outline-offset: 3px; }
  .item-title {
    font-size: 15.5px; font-weight: 650; line-height: 1.42;
    letter-spacing: -.005em;
    overflow-wrap: anywhere;
  }
  .item[data-status="done"] .item-title {
    color: var(--muted);
    text-decoration: line-through;
    text-decoration-thickness: 1.5px;
    text-decoration-color: var(--line-strong);
  }
  .item[data-status="paused"] .item-title { color: var(--muted); }
  .item-note {
    margin: 3px 0 0;
    font-size: 12px; color: var(--muted); line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .item-meta {
    margin-top: 6px;
    display: flex; flex-wrap: wrap; align-items: center;
    gap: 4px 6px;
    font-size: 11px; color: var(--muted);
    line-height: 1.4;
  }
  .item-meta .dot { font-style: normal; opacity: .45; }
  .due {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 2px 7px;
    border-radius: 7px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    font-size: 10.5px; font-weight: 650;
    color: var(--muted);
    white-space: nowrap;
  }
  .due.today { background: var(--accent-soft); border-color: transparent; color: var(--accent-ink); }
  .due.over { background: var(--danger-soft); border-color: transparent; color: var(--danger); }
  .due.soon { background: var(--gold-soft); border-color: transparent; color: var(--gold-ink); }
  .state-tag {
    display: inline-flex; align-items: center;
    padding: 2px 7px; border-radius: 7px;
    background: var(--surface-2); border: 1px solid var(--line);
    font-size: 10.5px; font-weight: 650; color: var(--muted);
  }
  .repeat-count {
    display: inline-flex; align-items: center;
    padding: 2px 7px; border-radius: 7px;
    background: var(--gold-soft);
    color: var(--gold-ink);
    font-size: 10.5px; font-weight: 700;
    white-space: nowrap;
  }

  .progress { margin-top: 9px; display: flex; align-items: center; gap: 8px; }
  .progress .track {
    flex: 1; height: 4px; border-radius: 99px;
    background: var(--line);
    overflow: hidden;
  }
  .progress .fill {
    display: block; height: 100%; border-radius: 99px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width .3s ease;
  }
  .progress .pnum { font-size: 10px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* ---------- 空状态 ---------- */
  .empty {
    margin-top: 4px;
    padding: 32px 20px 28px;
    border-radius: 24px;
    border: 1.5px dashed var(--line-strong);
    background: color-mix(in srgb, var(--surface) 52%, transparent);
    text-align: center;
  }
  .empty-mark {
    width: 50px; height: 50px;
    margin: 0 auto 12px;
    border-radius: 17px;
    display: grid; place-items: center;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 22px;
    transform: rotate(-6deg);
  }
  .empty h3 { margin: 0; font-size: 16px; font-weight: 750; letter-spacing: -.01em; }
  .empty p {
    margin: 7px auto 0;
    max-width: 290px;
    font-size: 12.5px; color: var(--muted); line-height: 1.65;
  }
  .empty-cta {
    margin-top: 17px;
    padding: 11px 18px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), #E8542E);
    color: #fff;
    font-size: 13.5px; font-weight: 700;
    box-shadow: 0 12px 24px -14px rgba(242, 98, 60, .8);
    transition: transform .15s;
  }
  .empty-cta:active { transform: scale(.96); }
  .suggest {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px dashed var(--line);
    display: flex; flex-wrap: wrap; gap: 7px; justify-content: center;
  }
  .suggest > span {
    width: 100%;
    font-size: 10.5px; color: var(--muted); margin-bottom: 2px;
  }
  .suggest button {
    padding: 6px 10px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-2);
    font-size: 11.5px;
  }
  .suggest button:active { background: var(--surface-2); }

  /* ---------- 底部导航 ---------- */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    padding: 0 12px calc(env(safe-area-inset-bottom, 0px) + 10px);
    pointer-events: none;
  }
  .tabbar-inner {
    pointer-events: auto;
    max-width: 620px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 2px;
    padding: 7px;
    border-radius: 24px;
    border: 1px solid var(--line);
    background: var(--surface);
    background: color-mix(in srgb, var(--surface) 86%, transparent);
    -webkit-backdrop-filter: blur(18px) saturate(1.4);
    backdrop-filter: blur(18px) saturate(1.4);
    box-shadow: 0 20px 44px -22px rgba(45, 28, 14, .55);
  }
  .tab {
    position: relative;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 6px 0 5px;
    border-radius: 17px;
    color: var(--muted);
    font-size: 10px; font-weight: 650;
    transition: color .18s, background .18s;
  }
  .tab-ico { display: grid; place-items: center; width: 22px; height: 22px; }
  .tab-ico svg { width: 21px; height: 21px; }
  .tab.active {
    color: var(--accent-ink);
    background: var(--accent-soft);
    font-weight: 750;
  }
  [data-theme="dark"] .tab.active { color: var(--accent); }
  .tab .badge {
    position: absolute; top: 4px; left: calc(50% + 9px);
    min-width: 15px; height: 15px; padding: 0 3px;
    border-radius: 99px;
    display: none; place-items: center;
    background: var(--accent); color: #fff;
    font-size: 9px; font-weight: 800; line-height: 1;
    font-variant-numeric: tabular-nums;
    box-shadow: 0 0 0 2px var(--surface);
  }
  .tab .badge.show { display: grid; }

  .fab {
    position: fixed; z-index: 41;
    right: max(18px, calc((100vw - 620px) / 2 + 18px));
    bottom: calc(env(safe-area-inset-bottom, 0px) + 92px);
    width: 58px; height: 58px;
    border-radius: 21px;
    display: grid; place-items: center;
    background: linear-gradient(140deg, #FF8A5C, #EB502C);
    color: #fff;
    box-shadow: 0 16px 30px -12px rgba(235, 80, 44, .75), inset 0 1px 0 rgba(255, 255, 255, .3);
    transition: transform .16s ease;
  }
  .fab:active { transform: scale(.92) rotate(90deg); }
  .fab svg { width: 26px; height: 26px; }

  /* ---------- 底部弹出层 ---------- */
  .backdrop {
    position: fixed; inset: 0; z-index: 60;
    background: rgba(24, 17, 11, .48);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
    opacity: 0; pointer-events: none;
    transition: opacity .26s ease;
  }
  .backdrop.show { opacity: 1; pointer-events: auto; }

  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 70;
    display: flex; flex-direction: column;
    max-height: 92vh;
    max-height: 92dvh;
    border-radius: 28px 28px 0 0;
    background: var(--surface);
    box-shadow: 0 -20px 60px -20px rgba(0, 0, 0, .45);
    transform: translateY(103%);
    transition: transform .38s cubic-bezier(.22, .9, .26, 1), visibility 0s linear .38s;
    visibility: hidden;
  }
  .sheet.open {
    transform: translateY(0);
    visibility: visible;
    transition: transform .38s cubic-bezier(.22, .9, .26, 1), visibility 0s;
  }
  .sheet::before {
    content: "";
    position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--line), transparent);
  }
  .sheet-head { flex: 0 0 auto; padding: 9px 18px 0; }
  .grab {
    width: 40px; height: 4px; border-radius: 99px;
    background: var(--line-strong);
    margin: 0 auto 10px;
  }
  .sheet-title-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .sheet-title-row h2 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.01em; }
  .sheet-title-row .icon-btn { width: 34px; height: 34px; background: var(--surface-2); box-shadow: none; }
  .sheet-title-row .icon-btn svg { width: 17px; height: 17px; }

  .sheet-body {
    flex: 1 1 auto;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    padding: 6px 18px 20px;
  }

  .field { margin-top: 17px; }
  .field:first-child { margin-top: 12px; }
  .label {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-bottom: 8px;
    font-size: 12px; font-weight: 700;
    color: var(--muted);
    letter-spacing: .02em;
  }
  .label .hint { font-size: 10.5px; font-weight: 500; opacity: .8; }
  .label .req { font-size: 9.5px; font-weight: 600; color: var(--accent-ink); background: var(--accent-soft); padding: 2px 6px; border-radius: 5px; }

  .input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink);
    font-size: 16px; line-height: 1.5;
    transition: border-color .2s, background .2s;
    appearance: none;
  }
  .input:focus { outline: 0; border-color: var(--accent); background: var(--surface); }
  .input::placeholder { color: var(--muted); opacity: .6; }
  .title-input { font-size: 17px; font-weight: 650; padding: 14px; letter-spacing: -.01em; }
  .textarea { resize: none; min-height: 76px; font-size: 15px; }

  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
  .seg button {
    display: flex; flex-direction: column; align-items: center; gap: 1px;
    padding: 9px 4px;
    border-radius: 13px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink-2);
    transition: .16s;
  }
  .seg button b { font-size: 13.5px; font-weight: 650; }
  .seg button span { font-size: 9.5px; color: var(--muted); }
  .seg button.active { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .seg button.active span { color: var(--bg); opacity: .6; }

  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chips button {
    padding: 8px 13px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--ink-2);
    font-size: 13px; font-weight: 550;
    transition: .16s;
  }
  .chips button.active { background: var(--ink); border-color: var(--ink); color: var(--bg); font-weight: 650; }

  .field-hint {
    margin: 7px 2px 0;
    font-size: 10.5px; color: var(--muted); line-height: 1.5;
  }

  .date-row { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .date-box {
    display: flex; flex-direction: column; gap: 5px;
    padding: 8px 11px 9px;
    border-radius: 13px;
    border: 1px solid var(--line);
    background: var(--surface-2);
  }
  .date-box > span { font-size: 10px; font-weight: 650; color: var(--muted); letter-spacing: .04em; }
  .date-box input {
    width: 100%; min-width: 0;
    border: 0; background: transparent; padding: 0;
    font-size: 16px; color: var(--ink); outline: 0;
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
  }
  .date-box:focus-within { border-color: var(--accent); background: var(--surface); }

  input[type="range"] {
    width: 100%; height: 30px; margin: 0;
    accent-color: var(--accent);
    background: transparent;
  }

  .sheet-footer {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 9px;
    padding: 11px 18px calc(env(safe-area-inset-bottom, 0px) + 13px);
    border-top: 1px solid var(--line);
    background: var(--surface);
  }
  .btn {
    height: 52px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 16px; font-weight: 750;
    transition: transform .15s, filter .2s;
  }
  .btn:active { transform: scale(.975); }
  .btn.primary {
    flex: 1;
    background: linear-gradient(135deg, var(--accent), #E8542E);
    color: #fff;
    box-shadow: 0 14px 26px -14px rgba(242, 98, 60, .85);
  }
  .btn.icon-danger {
    width: 52px; flex: 0 0 auto;
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--danger);
  }
  .btn.icon-danger svg { width: 20px; height: 20px; }

  .settings-list {
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    background: var(--surface-2);
  }
  .settings-list button {
    display: flex; flex-direction: column; gap: 2px;
    width: 100%; padding: 13px 15px;
    text-align: left;
    border-bottom: 1px solid var(--line);
    transition: background .16s;
  }
  .settings-list button:last-child { border-bottom: 0; }
  .settings-list button:active { background: var(--surface); }
  .settings-list span { font-size: 14px; font-weight: 650; color: var(--ink); }
  .settings-list small { font-size: 11px; color: var(--muted); line-height: 1.5; }
  .settings-list .danger span { color: var(--danger); }

  .about {
    margin-top: 24px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    text-align: center;
  }
  .about-mark {
    width: 44px; height: 44px; border-radius: 14px;
    display: grid; place-items: center;
    background: linear-gradient(140deg, #FF9468, #EB502C);
    color: #FFF7EC; font-size: 23px; font-weight: 800;
    box-shadow: 0 10px 20px -12px rgba(235, 80, 44, .9);
  }
  .about p { margin: 0; font-size: 11px; color: var(--muted); line-height: 1.7; }

  /* ---------- 提示 & 彩纸 ---------- */
  .toast {
    position: fixed; left: 50%; z-index: 120;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 96px);
    transform: translate(-50%, 16px);
    max-width: calc(100vw - 34px);
    display: flex; align-items: center; gap: 12px;
    padding: 11px 15px;
    border-radius: 14px;
    background: var(--ink);
    color: var(--bg);
    box-shadow: 0 18px 34px -16px rgba(0, 0, 0, .55);
    font-size: 12.5px; font-weight: 550;
    opacity: 0; pointer-events: none;
    transition: opacity .22s ease, transform .22s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast button {
    flex: 0 0 auto;
    color: var(--accent-2);
    font-size: 12.5px; font-weight: 800;
  }
  .toast button:hover { text-decoration: underline; }

  #fx { position: fixed; inset: 0; z-index: 200; pointer-events: none; }

  .shake { animation: shake .38s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-7px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(3px); }
  }

  @media (min-width: 720px) {
    .app { padding-top: calc(env(safe-area-inset-top, 0px) + 34px); }
    .title { font-size: 36px; }
    .fab { bottom: calc(env(safe-area-inset-bottom, 0px) + 104px); }
    .sheet {
      left: 50%; right: auto; bottom: 26px;
      width: 520px;
      max-height: 88vh;
      border-radius: 28px;
      transform: translate(-50%, 110%);
    }
    .sheet.open { transform: translate(-50%, 0); }
    .sheet-footer { border-radius: 0 0 28px 28px; }
    .sheet-head { padding-top: 12px; }
  }

  @media (max-width: 380px) {
    .sort-btn span { font-size: 11px; }
    .summary { padding: 14px; }
    .ring, .ring svg { width: 58px; height: 58px; }
    .summary-main strong { font-size: 21px; }
    .tab-label { font-size: 9.5px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand-row">
      <div class="brand">
        <div class="logo" aria-hidden="true">事</div>
        <div class="brand-meta">
          <span class="date" id="today-label">今天</span>
          <span class="eyebrow">SOMEDAY LIST</span>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" data-action="toggle-theme" aria-label="切换深色或浅色模式">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.8 14.2A8.5 8.5 0 1 1 9.8 3.2a7 7 0 0 0 11 11Z"/>
          </svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2"/>
            <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/>
          </svg>
        </button>
        <button class="icon-btn" data-action="open-settings" aria-label="设置与数据备份">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/>
          </svg>
        </button>
      </div>
    </div>

    <h1 class="title">我想干的<span class="hl">大小事</span></h1>
    <p class="tagline">把心里那件事写下来，然后一件一件完成 <span class="spark">✦</span></p>

    <section class="summary" aria-label="完成进度">
      <div class="ring">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#FFC79A"/>
              <stop offset="1" stop-color="#FF7A52"/>
            </linearGradient>
          </defs>
          <circle cx="32" cy="32" r="26" fill="none" stroke="rgba(255,247,236,.15)" stroke-width="6"/>
          <circle id="ring-progress" class="ring-progress" cx="32" cy="32" r="26" fill="none"
                  stroke="url(#ringGrad)" stroke-width="6" stroke-linecap="round"
                  transform="rotate(-90 32 32)"/>
        </svg>
        <span class="ring-pct" id="ring-pct">0%</span>
      </div>
      <div class="summary-copy">
        <p class="summary-main"><strong id="stat-done">0</strong><span class="slash">/</span><span id="stat-total">0</span> 件已完成</p>
        <p class="summary-sub" id="summary-sub">从一件小事开始吧</p>
      </div>
      <span class="summary-star" aria-hidden="true">✦</span>
    </section>
  </header>

  <main>
    <div class="section-head">
      <div class="section-title">
        <span id="section-title">全部想做的事</span>
        <span class="count-pill" id="view-count">0</span>
      </div>
      <div class="head-actions">
        <button class="mini-btn" data-action="toggle-search" aria-label="搜索想做的事">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/>
          </svg>
        </button>
        <button class="sort-btn" data-action="cycle-sort" aria-label="切换排序方式">
          <span id="sort-label">智能排序</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8 9.5 12 5.5l4 4M8 14.5l4 4 4-4"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="cat-row" id="cat-row" aria-label="按分类筛选"></div>

    <div class="search-row" id="search-row">
      <svg class="search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/>
      </svg>
      <input id="search-input" type="search" placeholder="搜索想做的事…" autocomplete="off" enterkeyhint="search" aria-label="搜索">
      <button class="search-clear" data-action="clear-search" aria-label="清空搜索">×</button>
    </div>

    <div class="list" id="list"></div>
  </main>
</div>

<nav class="tabbar" aria-label="切换视图">
  <div class="tabbar-inner">
    <button class="tab active" data-action="view" data-view="all" aria-label="全部想做的事">
      <span class="tab-ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">
          <rect x="3.5" y="3.5" width="7" height="7" rx="2.2"/>
          <rect x="13.5" y="3.5" width="7" height="7" rx="2.2"/>
          <rect x="3.5" y="13.5" width="7" height="7" rx="2.2"/>
          <rect x="13.5" y="13.5" width="7" height="7" rx="2.2"/>
        </svg>
      </span>
      <span class="tab-label">全部</span>
    </button>
    <button class="tab" data-action="view" data-view="today" aria-label="今天要做的事">
      <span class="tab-ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/>
        </svg>
      </span>
      <span class="tab-label">今天</span>
      <span class="badge" id="today-badge">0</span>
    </button>
    <button class="tab" data-action="view" data-view="doing" aria-label="进行中的事">
      <span class="tab-ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5"/>
          <path d="M10 8.8v6.4l5.2-3.2Z" fill="currentColor" stroke="none"/>
        </svg>
      </span>
      <span class="tab-label">进行中</span>
    </button>
    <button class="tab" data-action="view" data-view="done" aria-label="已完成的事">
      <span class="tab-ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5"/>
          <path d="m8.2 12.2 2.6 2.6 5-5.4"/>
        </svg>
      </span>
      <span class="tab-label">已完成</span>
    </button>
  </div>
</nav>

<button class="fab" data-action="add" aria-label="添加一件想做的事">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
    <path d="M12 5v14M5 12h14"/>
  </svg>
</button>

<div class="backdrop" id="backdrop"></div>

<!-- 添加 / 编辑 -->
<section class="sheet" id="editor" role="dialog" aria-modal="true" aria-labelledby="editor-title" aria-hidden="true">
  <div class="sheet-head">
    <div class="grab" aria-hidden="true"></div>
    <div class="sheet-title-row">
      <h2 id="editor-title">新的想法</h2>
      <button class="icon-btn" data-action="close-editor" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6 6 18"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="sheet-body">
    <div class="field">
      <label class="label" for="f-title">这件事是 <span class="req">必填</span></label>
      <input id="f-title" class="input title-input" type="text" maxlength="80" placeholder="比如：去海边看一次日落" autocomplete="off">
    </div>

    <div class="field">
      <div class="label">它的大小</div>
      <div class="seg" id="f-size" data-group="size">
        <button type="button" data-value="small"><b>小事</b><span>一会儿</span></button>
        <button type="button" data-value="medium"><b>中事</b><span>几天</span></button>
        <button type="button" data-value="large"><b>大事</b><span>长期</span></button>
      </div>
    </div>

    <div class="field">
      <div class="label">归到哪一类</div>
      <div class="chips" id="f-category" data-group="category">
        <button type="button" data-value="生活">生活</button>
        <button type="button" data-value="工作">工作</button>
        <button type="button" data-value="学习">学习</button>
        <button type="button" data-value="健康">健康</button>
        <button type="button" data-value="旅行">旅行</button>
        <button type="button" data-value="兴趣">兴趣</button>
        <button type="button" data-value="其他">其他</button>
      </div>
    </div>

    <div class="field">
      <div class="label">重要程度</div>
      <div class="seg" id="f-priority" data-group="priority">
        <button type="button" data-value="low"><b>不急</b><span>慢慢来</span></button>
        <button type="button" data-value="mid"><b>一般</b><span>有空就做</span></button>
        <button type="button" data-value="high"><b>重要</b><span>优先安排</span></button>
      </div>
    </div>

    <div class="field">
      <div class="label">想多久做一次</div>
      <div class="chips" id="f-cycle" data-group="cycle">
        <button type="button" data-value="once">就一次</button>
        <button type="button" data-value="daily">每天</button>
        <button type="button" data-value="weekly">每周</button>
        <button type="button" data-value="monthly">每月</button>
        <button type="button" data-value="yearly">每年</button>
      </div>
      <p class="field-hint hidden" id="cycle-hint">循环的事点「完成」后，会自动排到下一次 ✦</p>
    </div>

    <div class="field">
      <div class="label">计划时间 <span class="hint">都可以不填</span></div>
      <div class="date-row">
        <label class="date-box"><span>开始</span><input type="date" id="f-start"></label>
        <label class="date-box"><span>截止</span><input type="date" id="f-due"></label>
      </div>
    </div>

    <div class="field">
      <div class="label">现在的状态</div>
      <div class="chips" id="f-status" data-group="status">
        <button type="button" data-value="todo">想做</button>
        <button type="button" data-value="doing">进行中</button>
        <button type="button" data-value="done">已完成</button>
        <button type="button" data-value="paused">先搁置</button>
      </div>
    </div>

    <div class="field hidden" id="progress-field">
      <div class="label">做到哪一步了 <span class="hint" id="f-progress-val">0%</span></div>
      <input type="range" id="f-progress" min="0" max="100" step="5" value="0">
    </div>

    <div class="field">
      <div class="label">碎碎念 / 备注 <span class="hint">可不填</span></div>
      <textarea id="f-note" class="input textarea" rows="2" maxlength="500" placeholder="想怎么开始？和谁一起？为什么想做？"></textarea>
    </div>
  </div>

  <div class="sheet-footer">
    <button class="btn icon-danger hidden" id="delete-btn" data-action="delete-item" aria-label="删除这件事">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 7h16M9.5 7V5.2A1.2 1.2 0 0 1 10.7 4h2.6a1.2 1.2 0 0 1 1.2 1.2V7M6.5 7l.8 11.2A1.8 1.8 0 0 0 9.1 20h5.8a1.8 1.8 0 0 0 1.8-1.8L17.5 7M10 11v5M14 11v5"/>
      </svg>
    </button>
    <button class="btn primary" data-action="save-item">保存</button>
  </div>
</section>

<!-- 设置 -->
<section class="sheet" id="settings" role="dialog" aria-modal="true" aria-labelledby="settings-title" aria-hidden="true">
  <div class="sheet-head">
    <div class="grab" aria-hidden="true"></div>
    <div class="sheet-title-row">
      <h2 id="settings-title">设置</h2>
      <button class="icon-btn" data-action="close-settings" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6 6 18"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="sheet-body">
    <div class="field">
      <div class="label">外观</div>
      <div class="chips" id="theme-group" data-group="theme">
        <button type="button" data-value="auto">跟随系统</button>
        <button type="button" data-value="light">浅色</button>
        <button type="button" data-value="dark">深色</button>
      </div>
    </div>

    <div class="field">
      <div class="label">数据 <span class="hint" id="data-summary"></span></div>
      <div class="settings-list">
        <button type="button" data-action="export">
          <span>导出备份</span>
          <small>存成一个 JSON 文件，换手机也不怕</small>
        </button>
        <button type="button" data-action="import">
          <span>导入备份</span>
          <small>用之前的备份覆盖现在的内容</small>
        </button>
        <button type="button" class="danger" data-action="clear-all">
          <span>清空所有数据</span>
          <small>删掉就真的找不回来了</small>
        </button>
      </div>
      <p class="field-hint" id="storage-hint">正在检查存储方式…</p>
    </div>

    <div class="about">
      <div class="about-mark" aria-hidden="true">事</div>
      <p>「我想干的大小事」 v1.0<br>大事小事，都是你认真想过的生活。</p>
    </div>
  </div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span id="toast-msg"></span>
  <button type="button" id="toast-btn" class="hidden">撤销</button>
</div>

<canvas id="fx" aria-hidden="true"></canvas>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<noscript>
  <p style="padding:24px;text-align:center">这个小应用需要开启 JavaScript 才能使用。</p>
</noscript>

<script>
(function () {
  'use strict';

  /* ================= 常量 ================= */
  var STORE_KEY = 'wishlist.v1';
  var SETTINGS_KEY = 'wishlist.settings.v1';
  var API_PATH = 'api/data';
  var CATEGORIES = ['生活', '工作', '学习', '健康', '旅行', '兴趣', '其他'];
  var SIZES = {
    small: { label: '小事', hint: '一会儿' },
    medium: { label: '中事', hint: '几天' },
    large: { label: '大事', hint: '长期' }
  };
  var PRIORITIES = { low: '不急', mid: '一般', high: '重要' };
  var CYCLES = { once: '就一次', daily: '每天', weekly: '每周', monthly: '每月', yearly: '每年' };
  var STATUSES = { todo: '想做', doing: '进行中', done: '已完成', paused: '先搁置' };
  var SORT_LABEL = { smart: '智能排序', newest: '最新添加', due: '截止优先' };
  var SORT_ORDER = ['smart', 'newest', 'due'];
  var VIEW_TITLE = { all: '全部想做的事', today: '今天要做的事', doing: '正在做的事', done: '已经完成的事' };
  var RING_C = 163.36;
  var WEEK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

  /* ================= DOM ================= */
  var $ = function (id) { return document.getElementById(id); };
  var listEl = $('list');
  var sectionTitle = $('section-title');
  var viewCount = $('view-count');
  var sortLabel = $('sort-label');
  var catRow = $('cat-row');
  var searchRow = $('search-row');
  var searchInput = $('search-input');
  var todayLabel = $('today-label');
  var todayBadge = $('today-badge');
  var ring = $('ring-progress');
  var ringPct = $('ring-pct');
  var statDone = $('stat-done');
  var statTotal = $('stat-total');
  var summarySub = $('summary-sub');
  var backdrop = $('backdrop');
  var editor = $('editor');
  var editorTitle = $('editor-title');
  var settingsSheet = $('settings');
  var themeGroup = $('theme-group');
  var deleteBtn = $('delete-btn');
  var dataSummary = $('data-summary');
  var storageHint = $('storage-hint');
  var importFile = $('import-file');
  var metaTheme = $('meta-theme');

  var fTitle = $('f-title');
  var fNote = $('f-note');
  var fSize = $('f-size');
  var fCategory = $('f-category');
  var fPriority = $('f-priority');
  var fCycle = $('f-cycle');
  var fStatus = $('f-status');
  var fStart = $('f-start');
  var fDue = $('f-due');
  var fProgress = $('f-progress');
  var fProgressVal = $('f-progress-val');
  var progressField = $('progress-field');
  var cycleHint = $('cycle-hint');

  var toastEl = $('toast');
  var toastMsg = $('toast-msg');
  var toastBtn = $('toast-btn');
  var fab = document.querySelector('.fab');
  var fx = $('fx');
  var ctx = fx.getContext('2d');

  /* ================= 状态 ================= */
  var state = {
    items: [],
    view: 'all',
    category: 'all',
    query: '',
    sort: 'smart',
    theme: 'auto',
    editingId: null,
    searchOpen: false
  };

  var toastTimer = null;
  var toastAction = null;
  var lastFocus = null;
  var particles = [];
  var fxRaf = 0;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);

  /* 本机存储 + 可选的电脑端存储（由 server.py 提供） */
  var storeMeta = { savedAt: 0 };
  var syncAvailable = false;
  var dirty = false;
  var syncTried = false;

  /* ================= 基础工具 ================= */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function uid() {
    if (window.crypto && typeof window.crypto.randomUUID === 'function') {
      try { return window.crypto.randomUUID(); } catch (e) {}
    }
    return 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
  }

  function pad2(n) { return String(n).padStart(2, '0'); }
  function toISO(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function todayISO() { return toISO(new Date()); }
  function parseISO(s) {
    var p = String(s).split('-').map(Number);
    return new Date(p[0], p[1] - 1, p[2]);
  }
  function isDateStr(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }
  function addDaysISO(s, n) {
    var d = parseISO(s);
    d.setDate(d.getDate() + n);
    return toISO(d);
  }
  function addMonthsISO(s, n) {
    var d = parseISO(s);
    var day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + n);
    var last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    d.setDate(Math.min(day, last));
    return toISO(d);
  }
  function addPeriod(s, cycle) {
    if (cycle === 'daily') return addDaysISO(s, 1);
    if (cycle === 'weekly') return addDaysISO(s, 7);
    if (cycle === 'monthly') return addMonthsISO(s, 1);
    if (cycle === 'yearly') return addMonthsISO(s, 12);
    return s;
  }
  function daysBetween(a, b) {
    return Math.round((parseISO(a) - parseISO(b)) / 86400000);
  }
  function formatDate(s) {
    if (!s) return '';
    var d = parseISO(s);
    var now = new Date();
    var prefix = d.getFullYear() === now.getFullYear() ? '' : d.getFullYear() + '年';
    return prefix + (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }
  function formatStamp(ms) {
    var d = new Date(ms);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function truncate(s, n) {
    s = String(s || '');
    return s.length > n ? s.slice(0, n) + '…' : s;
  }
  function clamp(n, min, max) { return Math.min(max, Math.max(min, n)); }

  /* ================= 数据 ================= */
  function normalize(raw) {
    if (!raw || typeof raw !== 'object') return null;
    var title = String(raw.title || '').trim();
    if (!title) return null;
    var cycle = CYCLES[raw.cycle] ? raw.cycle : 'once';
    var status = STATUSES[raw.status] ? raw.status : 'todo';
    var size = SIZES[raw.size] ? raw.size : 'medium';
    var priority = PRIORITIES[raw.priority] ? raw.priority : 'mid';
    var category = CATEGORIES.indexOf(raw.category) >= 0 ? raw.category : '其他';
    var completedAt = raw.completedAt ? Number(raw.completedAt) : null;
    if (status === 'done' && !completedAt) completedAt = Date.now();
    if (status !== 'done') completedAt = null;
    return {
      id: raw.id ? String(raw.id) : uid(),
      title: title.slice(0, 80),
      note: String(raw.note || '').slice(0, 500),
      category: category,
      size: size,
      priority: priority,
      status: status,
      cycle: cycle,
      startDate: isDateStr(raw.startDate) ? raw.startDate : '',
      dueDate: isDateStr(raw.dueDate) ? raw.dueDate : '',
      progress: clamp(Number(raw.progress) || 0, 0, 100),
      doneCount: Math.max(0, Number(raw.doneCount) || 0),
      createdAt: Number(raw.createdAt) || Date.now(),
      updatedAt: Number(raw.updatedAt) || Date.now(),
      completedAt: completedAt
    };
  }

  function loadItems() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return [];
      var data = JSON.parse(raw);
      storeMeta.savedAt = Date.parse(data && data.savedAt ? data.savedAt : '') || 0;
      var arr = Array.isArray(data) ? data : (data && Array.isArray(data.items) ? data.items : []);
      return arr.map(normalize).filter(Boolean);
    } catch (e) {
      console.warn('读取数据失败', e);
      return [];
    }
  }

  function buildPayload() {
    return {
      version: 1,
      savedAt: new Date().toISOString(),
      items: state.items
    };
  }

  function writeLocal(payload) {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(payload));
      storeMeta.savedAt = Date.parse(payload.savedAt) || Date.now();
      return true;
    } catch (e) {
      toast('保存失败，浏览器存储空间可能满了');
      return false;
    }
  }

  /* 用户操作后的保存：本机必存，连上电脑端时再同步写 data.json */
  function persist() {
    var payload = buildPayload();
    var ok = writeLocal(payload);
    dirty = true;
    pushRemote(payload);
    return ok;
  }

  /* 从电脑端载入数据时，只更新本机缓存，不再推回去 */
  function saveLocalSnapshot(items, savedAt) {
    writeLocal({
      version: 1,
      savedAt: savedAt || new Date().toISOString(),
      items: items
    });
  }

  function pushRemote(payload) {
    if (!syncAvailable) return;
    try {
      fetch(API_PATH, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).catch(function () {});
    } catch (e) {}
  }

  function updateStorageHint() {
    if (!storageHint) return;
    storageHint.textContent = syncAvailable
      ? '已连接电脑端存储：内容会同时写进 data.json，换网络或换设备访问都能读回来。'
      : '数据只保存在这台设备的浏览器里，清理浏览器数据前，记得先导出备份。';
  }

  /* 如果页面是由 server.py 提供的，就优先和电脑上的 data.json 对齐 */
  function syncWithServer() {
    if (!/^https?:$/.test(window.location.protocol) || syncTried) return;
    syncTried = true;
    fetch(API_PATH, { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (data) {
        if (!data || !Array.isArray(data.items)) throw new Error('bad data');
        syncAvailable = true;
        updateStorageHint();

        var remote = data.items.map(normalize).filter(Boolean);
        var remoteSaved = Date.parse(data.savedAt || '') || 0;

        /* 页面加载后用户已经开始改东西了，以本机为准，推上去 */
        if (dirty) {
          pushRemote(buildPayload());
          return;
        }

        if (!remote.length && !state.items.length) return;

        var localSaved = storeMeta.savedAt || 0;

        function adoptRemote() {
          state.items = remote;
          saveLocalSnapshot(remote, data.savedAt);
          render();
          toast(remote.length ? '已同步电脑上的 ' + remote.length + ' 件事' : '电脑上的清单已经清空');
        }

        /* 时间戳更新的一方优先，哪怕更新的动作是「清空」 */
        if (remoteSaved && localSaved && remoteSaved > localSaved + 1500) {
          adoptRemote();
          return;
        }
        if (remoteSaved && localSaved && localSaved > remoteSaved + 1500) {
          pushRemote(buildPayload());
          return;
        }

        if (!remote.length && state.items.length) {
          pushRemote(buildPayload());
          return;
        }
        if (remote.length && !state.items.length) {
          adoptRemote();
          return;
        }
      })
      .catch(function () {
        /* 直接打开文件或放在普通静态托管上时，就只用本机存储 */
        updateStorageHint();
      });
  }

  function loadSettings() {
    try {
      var s = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
      return { theme: ['auto', 'light', 'dark'].indexOf(s.theme) >= 0 ? s.theme : 'auto' };
    } catch (e) {
      return { theme: 'auto' };
    }
  }

  function saveSettings() {
    try {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify({ theme: state.theme }));
    } catch (e) {}
  }

  /* ================= 日期展示 ================= */
  function dueInfo(item) {
    if (!item.dueDate) return { text: '', tone: 'none' };
    if (item.status === 'done') return { text: formatDate(item.dueDate), tone: 'done' };
    var diff = daysBetween(item.dueDate, todayISO());
    if (diff < 0) return { text: '逾期 ' + Math.abs(diff) + ' 天', tone: 'over' };
    if (diff === 0) return { text: '今天截止', tone: 'today' };
    if (diff === 1) return { text: '明天截止', tone: 'soon' };
    if (diff <= 7) return { text: diff + ' 天后', tone: 'soon' };
    return { text: formatDate(item.dueDate), tone: 'normal' };
  }

  function isTodayItem(item) {
    if (item.status === 'done' || item.status === 'paused') return false;
    if (item.startDate === todayISO()) return true;
    if (!item.dueDate) return item.cycle === 'daily';
    return item.dueDate <= todayISO();
  }

  /* ================= 过滤 & 排序 ================= */
  function priorityWeight(p) {
    return p === 'high' ? 3 : p === 'mid' ? 2 : 1;
  }

  function visibleItems() {
    var arr = state.items.slice();
    var q = state.query.trim().toLowerCase();

    /* 搜索时跨所有分类和状态找，不受当前标签页限制 */
    if (q) {
      arr = arr.filter(function (i) {
        return (i.title + ' ' + i.note + ' ' + i.category).toLowerCase().indexOf(q) >= 0;
      });
      sortItems(arr);
      return arr;
    }

    if (state.view === 'today') arr = arr.filter(isTodayItem);
    else if (state.view === 'doing') arr = arr.filter(function (i) { return i.status === 'doing'; });
    else if (state.view === 'done') arr = arr.filter(function (i) { return i.status === 'done'; });

    if (state.category !== 'all') {
      arr = arr.filter(function (i) { return i.category === state.category; });
    }

    sortItems(arr);
    return arr;
  }

  function statusRank(item) {
    if (item.status === 'done') return 3;
    if (item.status === 'paused') return 2;
    return 1;
  }

  function sortItems(arr) {
    if (state.sort === 'newest') {
      arr.sort(function (a, b) { return b.createdAt - a.createdAt; });
      return;
    }
    if (state.sort === 'due') {
      arr.sort(function (a, b) {
        var ad = a.dueDate || '9999-99-99';
        var bd = b.dueDate || '9999-99-99';
        return ad.localeCompare(bd) || priorityWeight(b.priority) - priorityWeight(a.priority);
      });
      return;
    }
    if (state.view === 'done' && !state.query) {
      arr.sort(function (a, b) { return (b.completedAt || 0) - (a.completedAt || 0); });
      return;
    }
    arr.sort(function (a, b) {
      /* 已完成、搁置的沉到下面，别抢正在推进的事 */
      var r = statusRank(a) - statusRank(b);
      if (r) return r;
      var p = priorityWeight(b.priority) - priorityWeight(a.priority);
      if (p) return p;
      var ad = a.dueDate || '9999-99-99';
      var bd = b.dueDate || '9999-99-99';
      var d = ad.localeCompare(bd);
      if (d) return d;
      return b.createdAt - a.createdAt;
    });
  }

  /* ================= 渲染 ================= */
  function render() {
    if (state.category !== 'all' && !state.items.some(function (i) { return i.category === state.category; })) {
      state.category = 'all';
    }
    renderHeader();
    renderTabs();
    var items = visibleItems();
    renderToolbar(items);
    renderList(items);
    searchRow.classList.toggle('show', state.searchOpen);
    /* 一条都没有时，中间的大按钮已经足够，别用悬浮按钮压住示例 */
    fab.classList.toggle('hidden', state.items.length === 0);
  }

  function renderHeader() {
    var total = state.items.length;
    var done = state.items.filter(function (i) { return i.status === 'done'; }).length;
    var pct = total ? Math.round((done / total) * 100) : 0;
    var todayCount = state.items.filter(isTodayItem).length;

    ring.style.strokeDashoffset = String(RING_C * (1 - pct / 100));
    ringPct.textContent = pct + '%';
    statDone.textContent = done;
    statTotal.textContent = total;

    if (!total) {
      summarySub.textContent = '从一件小事开始吧';
    } else if (todayCount > 0) {
      summarySub.textContent = '今天还有 ' + todayCount + ' 件事想推进';
    } else if (done === total) {
      summarySub.textContent = '全部完成，今天可以安心休息了 ✦';
    } else {
      summarySub.textContent = '今天没有安排，慢慢来';
    }

    todayBadge.textContent = todayCount;
    todayBadge.classList.toggle('show', todayCount > 0);
  }

  function renderTabs() {
    var tabs = document.querySelectorAll('.tab');
    for (var i = 0; i < tabs.length; i++) {
      var active = tabs[i].dataset.view === state.view;
      tabs[i].classList.toggle('active', active);
      if (active) tabs[i].setAttribute('aria-current', 'page');
      else tabs[i].removeAttribute('aria-current');
    }
  }

  function renderToolbar(items) {
    var searching = !!state.query.trim();
    sectionTitle.textContent = searching ? '搜索结果' : VIEW_TITLE[state.view];
    viewCount.textContent = items.length;
    sortLabel.textContent = SORT_LABEL[state.sort];

    var cats = CATEGORIES.filter(function (c) {
      return state.items.some(function (i) { return i.category === c; });
    });

    if (searching || !state.items.length || cats.length < 2) {
      catRow.innerHTML = '';
      catRow.style.display = 'none';
    } else {
      catRow.style.display = '';
      var html = '<button class="cat-chip' + (state.category === 'all' ? ' active' : '') + '" data-action="category" data-cat="all">全部</button>';
      cats.forEach(function (c) {
        html += '<button class="cat-chip' + (state.category === c ? ' active' : '') + '" data-action="category" data-cat="' + esc(c) + '">' + esc(c) + '</button>';
      });
      catRow.innerHTML = html;
    }
  }

  function renderList(items) {
    if (!items.length) {
      listEl.innerHTML = emptyHTML();
      return;
    }
    var html = '';
    items.forEach(function (item) {
      html += cardHTML(item);
    });
    listEl.innerHTML = html;
  }

  function cardHTML(item) {
    var meta = [];
    meta.push(esc(item.category));
    meta.push(esc(SIZES[item.size].label));
    if (item.cycle !== 'once') meta.push(esc(CYCLES[item.cycle]));

    var metaHTML = meta.map(function (m, idx) {
      return '<span>' + m + '</span>' + (idx < meta.length - 1 ? '<i class="dot">·</i>' : '');
    }).join('');

    var due = dueInfo(item);
    var dueHTML = due.tone !== 'none'
      ? '<span class="due ' + due.tone + '">' + esc(due.text) + '</span>'
      : '';

    var repeatHTML = (item.cycle !== 'once' && item.doneCount > 0)
      ? '<span class="repeat-count">已 ' + item.doneCount + ' 次</span>'
      : '';

    var pausedHTML = item.status === 'paused' ? '<span class="state-tag">搁置中</span>' : '';

    var progressHTML = '';
    if (item.status !== 'done' && item.progress > 0) {
      progressHTML = '<div class="progress"><span class="track"><span class="fill" style="width:' +
        item.progress + '%"></span></span><span class="pnum">' + item.progress + '%</span></div>';
    }

    var noteHTML = item.note ? '<p class="item-note">' + esc(item.note) + '</p>' : '';

    var checkLabel = item.status === 'done'
      ? '标记为未完成'
      : (item.cycle !== 'once' ? '完成本次' : '完成这件事');

    return '' +
      '<article class="item" data-prio="' + item.priority + '" data-status="' + item.status +
      '" data-cycle="' + item.cycle + '" data-id="' + esc(item.id) + '">' +
        '<button class="check" type="button" data-action="toggle" data-id="' + esc(item.id) + '" ' +
          'aria-label="' + checkLabel + '" aria-pressed="' + (item.status === 'done') + '">' +
          '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.6 10.6l3.5 3.5L15.4 6.4"/></svg>' +
        '</button>' +
        '<div class="item-main" role="button" tabindex="0" data-action="edit" data-id="' + esc(item.id) + '" aria-label="编辑：' + esc(item.title) + '">' +
          '<div class="item-title">' + esc(item.title) + '</div>' +
          noteHTML +
          '<div class="item-meta">' + metaHTML + dueHTML + repeatHTML + pausedHTML + '</div>' +
          progressHTML +
        '</div>' +
      '</article>';
  }

  function emptyHTML() {
    if (state.query) {
      return '<div class="empty">' +
        '<div class="empty-mark" aria-hidden="true">✦</div>' +
        '<h3>没找到相关的事</h3>' +
        '<p>换个词试试，或者清空搜索看看全部。</p>' +
        '<button class="empty-cta" data-action="clear-search">清空搜索</button>' +
      '</div>';
    }
    if (state.category !== 'all' && state.items.length) {
      return '<div class="empty">' +
        '<div class="empty-mark" aria-hidden="true">✦</div>' +
        '<h3>「' + esc(state.category) + '」里还没有事</h3>' +
        '<p>换个分类看看，或者把这件事放进这个分类。</p>' +
        '<button class="empty-cta" data-action="all-category">看看全部</button>' +
      '</div>';
    }
    if (state.view === 'today') {
      return '<div class="empty">' +
        '<div class="empty-mark" aria-hidden="true">☀</div>' +
        '<h3>今天没有安排</h3>' +
        '<p>去享受生活，或者提前看看别的事。</p>' +
        '<button class="empty-cta" data-action="view" data-view="all">看看全部</button>' +
      '</div>';
    }
    if (state.view === 'doing') {
      return '<div class="empty">' +
        '<div class="empty-mark" aria-hidden="true">▶</div>' +
        '<h3>还没有进行中的事</h3>' +
        '<p>挑一件开始吧，哪怕只做五分钟。</p>' +
        '<button class="empty-cta" data-action="view" data-view="all">去挑一件</button>' +
      '</div>';
    }
    if (state.view === 'done') {
      return '<div class="empty">' +
        '<div class="empty-mark" aria-hidden="true">✓</div>' +
        '<h3>还没有完成的事</h3>' +
        '<p>完成第一件后，它会出现在这里。</p>' +
        '<button class="empty-cta" data-action="view" data-view="all">去完成一件</button>' +
      '</div>';
    }
    return '<div class="empty">' +
      '<div class="empty-mark" aria-hidden="true">✦</div>' +
      '<h3>还没有想做的事</h3>' +
      '<p>把大事、小事写下来，就有着落了。</p>' +
      '<button class="empty-cta" data-action="add">+ 写下第一件事</button>' +
      '<div class="suggest">' +
        '<span>不知道写什么？试试这些：</span>' +
        '<button data-action="suggest" data-title="去海边看一次日落" data-cat="旅行">去海边看一次日落</button>' +
        '<button data-action="suggest" data-title="读完一本搁置很久的书" data-cat="学习">读完一本搁置很久的书</button>' +
        '<button data-action="suggest" data-title="学会做一道拿手菜" data-cat="兴趣">学会做一道拿手菜</button>' +
      '</div>' +
    '</div>';
  }

  /* ================= 表单 ================= */
  function chipValue(container) {
    var active = container.querySelector('button.active');
    return active ? active.dataset.value : '';
  }

  function selectChip(container, value) {
    var buttons = container.querySelectorAll('button');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].classList.toggle('active', buttons[i].dataset.value === value);
    }
  }

  function syncProgressVisibility() {
    var show = chipValue(fStatus) === 'doing';
    progressField.classList.toggle('hidden', !show);
  }

  function syncCycleHint() {
    cycleHint.classList.toggle('hidden', chipValue(fCycle) === 'once');
  }

  function updateProgressLabel() {
    fProgressVal.textContent = fProgress.value + '%';
  }

  function openEditor(id) {
    var item = id ? state.items.filter(function (i) { return i.id === id; })[0] : null;
    state.editingId = item ? item.id : null;

    editorTitle.textContent = item ? '编辑这件事' : '新的想法';
    fTitle.value = item ? item.title : '';
    fNote.value = item ? item.note : '';
    selectChip(fSize, item ? item.size : 'medium');
    selectChip(fCategory, item ? item.category : '生活');
    selectChip(fPriority, item ? item.priority : 'mid');
    selectChip(fCycle, item ? item.cycle : 'once');
    selectChip(fStatus, item ? item.status : 'todo');
    fStart.value = item ? item.startDate : '';
    fDue.value = item ? item.dueDate : '';
    fProgress.value = item ? item.progress : 0;
    updateProgressLabel();
    syncProgressVisibility();
    syncCycleHint();
    deleteBtn.classList.toggle('hidden', !item);

    showSheet(editor);

    if (!item && window.matchMedia('(pointer: fine)').matches) {
      setTimeout(function () { fTitle.focus({ preventScroll: true }); }, 380);
    }
  }

  function saveEditor() {
    var title = fTitle.value.trim();
    if (!title) {
      fTitle.focus();
      editor.classList.remove('shake');
      void editor.offsetWidth;
      editor.classList.add('shake');
      setTimeout(function () { editor.classList.remove('shake'); }, 420);
      return;
    }
    if (fStart.value && fDue.value && fDue.value < fStart.value) {
      toast('截止日期不能早于开始日期');
      fDue.focus();
      return;
    }

    var now = Date.now();
    var status = chipValue(fStatus) || 'todo';
    var data = {
      title: title.slice(0, 80),
      note: fNote.value.trim().slice(0, 500),
      category: chipValue(fCategory) || '其他',
      size: chipValue(fSize) || 'medium',
      priority: chipValue(fPriority) || 'mid',
      cycle: chipValue(fCycle) || 'once',
      status: status,
      startDate: fStart.value || '',
      dueDate: fDue.value || '',
      progress: status === 'done' ? 100 : (Number(fProgress.value) || 0),
      updatedAt: now
    };

    if (state.editingId) {
      var item = state.items.filter(function (i) { return i.id === state.editingId; })[0];
      if (!item) return;
      var wasDone = item.status === 'done';
      Object.assign(item, data);
      if (status === 'done' && !wasDone) item.completedAt = now;
      if (status !== 'done') item.completedAt = null;
      toast('已更新');
    } else {
      var next = Object.assign({
        id: uid(),
        doneCount: 0,
        createdAt: now,
        completedAt: status === 'done' ? now : null
      }, data);
      state.items.unshift(next);
      /* 新加的事如果被当前筛选挡住，会看起来像没保存，所以回到全部 */
      state.view = 'all';
      state.category = 'all';
      state.query = '';
      state.searchOpen = false;
      searchInput.value = '';
      toast(status === 'done' ? '记下了一件已完成的事 ✦' : '记下了，慢慢来 ✦');
    }

    persist();
    closeSheet(editor);
    state.editingId = null;
    render();
  }

  function deleteEditing() {
    var idx = -1;
    var item = null;
    for (var i = 0; i < state.items.length; i++) {
      if (state.items[i].id === state.editingId) { idx = i; item = state.items[i]; break; }
    }
    if (!item) return;
    var snapshot = Object.assign({}, item);
    state.items.splice(idx, 1);
    persist();
    closeSheet(editor);
    state.editingId = null;
    render();
    toast('已删除「' + truncate(item.title, 12) + '」', '撤销', function () {
      state.items.splice(Math.min(idx, state.items.length), 0, snapshot);
      persist();
      render();
    });
  }

  /* ================= 完成 / 循环 ================= */
  function nextOccurrence(item) {
    var today = todayISO();
    var base;
    if (item.dueDate) base = item.dueDate > today ? item.dueDate : today;
    else if (item.startDate) base = item.startDate > today ? item.startDate : today;
    else base = today;

    var nextDue = addPeriod(base, item.cycle);
    var nextStart = item.startDate;

    if (item.startDate && item.dueDate) {
      var delta = Math.round((parseISO(nextDue) - parseISO(item.dueDate)) / 86400000);
      nextStart = addDaysISO(item.startDate, delta);
    }
    return { dueDate: nextDue, startDate: nextStart };
  }

  function toggleItem(id, sourceEl) {
    var item = null;
    for (var i = 0; i < state.items.length; i++) {
      if (state.items[i].id === id) { item = state.items[i]; break; }
    }
    if (!item) return;

    var snapshot = Object.assign({}, item);
    var rect = sourceEl ? sourceEl.getBoundingClientRect() : null;

    if (item.status === 'done') {
      item.status = 'todo';
      item.completedAt = null;
      if (item.progress >= 100) item.progress = 0;
      item.updatedAt = Date.now();
      persist();
      render();
      toast('已放回清单');
      return;
    }

    if (item.cycle !== 'once') {
      var next = nextOccurrence(item);
      item.doneCount = (item.doneCount || 0) + 1;
      item.dueDate = next.dueDate;
      item.startDate = next.startDate;
      item.status = 'todo';
      item.progress = 0;
      item.completedAt = Date.now();
      item.updatedAt = Date.now();
      persist();
      render();
      spawnConfetti(rect);
      toast('完成第 ' + item.doneCount + ' 次 · 下次 ' + formatDate(next.dueDate), '撤销', function () {
        Object.assign(item, snapshot);
        persist();
        render();
      });
      return;
    }

    item.status = 'done';
    item.completedAt = Date.now();
    item.progress = 100;
    item.updatedAt = Date.now();
    persist();
    render();
    spawnConfetti(rect);
    toast('完成啦，真棒 ✦', '撤销', function () {
      Object.assign(item, snapshot);
      persist();
      render();
    });
  }

  /* ================= 视图操作 ================= */
  function setView(view) {
    if (!VIEW_TITLE[view] || state.view === view) {
      if (state.view === view) window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    state.view = view;
    state.category = 'all';
    /* 切标签页时退出搜索，避免出现「点了标签却没变化」 */
    if (state.query || state.searchOpen) {
      state.query = '';
      state.searchOpen = false;
      searchInput.value = '';
    }
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function cycleSort() {
    var idx = SORT_ORDER.indexOf(state.sort);
    state.sort = SORT_ORDER[(idx + 1) % SORT_ORDER.length];
    render();
    toast('按「' + SORT_LABEL[state.sort] + '」排列');
  }

  function toggleSearch() {
    state.searchOpen = !state.searchOpen;
    if (state.searchOpen) {
      /* 搜索是全局的，切到「全部」让底部标签和结果对得上 */
      state.view = 'all';
      state.category = 'all';
    } else {
      state.query = '';
      searchInput.value = '';
    }
    render();
    if (state.searchOpen) {
      setTimeout(function () { searchInput.focus(); }, 80);
    }
  }

  function clearSearch() {
    state.query = '';
    searchInput.value = '';
    render();
  }

  function setCategory(cat) {
    state.category = cat;
    render();
  }

  /* ================= 主题 ================= */
  function applyTheme() {
    var dark = state.theme === 'dark' ||
      (state.theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    if (metaTheme) metaTheme.setAttribute('content', dark ? '#141210' : '#F6F3EC');
  }

  function setTheme(theme) {
    state.theme = ['auto', 'light', 'dark'].indexOf(theme) >= 0 ? theme : 'auto';
    saveSettings();
    applyTheme();
    selectChip(themeGroup, state.theme);
  }

  function toggleTheme() {
    var resolved = document.documentElement.dataset.theme;
    setTheme(resolved === 'dark' ? 'light' : 'dark');
  }

  /* ================= 弹层 ================= */
  function showSheet(el) {
    hideToast();
    lastFocus = document.activeElement;
    el.classList.add('open');
    el.setAttribute('aria-hidden', 'false');
    backdrop.classList.add('show');
    document.body.classList.add('sheet-open');
    if (el === settingsSheet) {
      dataSummary.textContent = '共 ' + state.items.length + ' 件';
    }
  }

  function closeSheet(el) {
    el.classList.remove('open');
    el.setAttribute('aria-hidden', 'true');
    if (!document.querySelector('.sheet.open')) {
      backdrop.classList.remove('show');
      document.body.classList.remove('sheet-open');
    }
    if (lastFocus && typeof lastFocus.focus === 'function') {
      try { lastFocus.focus({ preventScroll: true }); } catch (e) {}
    }
    lastFocus = null;
  }

  function closeAllSheets() {
    var open = document.querySelectorAll('.sheet.open');
    for (var i = 0; i < open.length; i++) closeSheet(open[i]);
  }

  /* ================= 数据备份 ================= */
  function exportData() {
    if (!state.items.length) {
      toast('还没有可以导出的内容');
      return;
    }
    var payload = {
      app: '我想干的大小事',
      version: 1,
      exportedAt: new Date().toISOString(),
      items: state.items
    };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '大小事备份-' + todayISO() + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    toast('备份已导出，收好它');
  }

  function handleImport(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(String(reader.result));
        var raw = Array.isArray(data) ? data : (data && Array.isArray(data.items) ? data.items : null);
        if (!raw) throw new Error('bad format');
        var imported = raw.map(normalize).filter(Boolean);
        if (!imported.length) throw new Error('empty');
        if (!window.confirm('导入 ' + imported.length + ' 件事，会覆盖现在的 ' + state.items.length + ' 件。继续吗？')) return;
        state.items = imported;
        persist();
        closeAllSheets();
        state.editingId = null;
        render();
        toast('已导入 ' + imported.length + ' 件事');
      } catch (e) {
        toast('导入失败，文件格式好像不对');
      }
    };
    reader.onerror = function () { toast('读取文件失败'); };
    reader.readAsText(file, 'utf-8');
  }

  function clearAll() {
    if (!state.items.length) {
      toast('还没有数据可以清空');
      return;
    }
    if (!window.confirm('确定清空所有 ' + state.items.length + ' 件事吗？这个操作无法撤销。')) return;
    state.items = [];
    persist();
    closeAllSheets();
    render();
    toast('已经清空了，重新开始吧');
  }

  /* ================= Toast ================= */
  function toast(msg, actionLabel, action) {
    toastMsg.textContent = msg;
    toastAction = action || null;
    if (actionLabel && action) {
      toastBtn.textContent = actionLabel;
      toastBtn.classList.remove('hidden');
    } else {
      toastBtn.classList.add('hidden');
    }
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove('show');
      toastAction = null;
    }, actionLabel ? 5200 : 2600);
  }

  function hideToast() {
    toastEl.classList.remove('show');
    toastAction = null;
    clearTimeout(toastTimer);
  }

  /* ================= 彩纸 ================= */
  function sizeCanvas() {
    fx.width = Math.floor(window.innerWidth * dpr);
    fx.height = Math.floor(window.innerHeight * dpr);
    fx.style.width = window.innerWidth + 'px';
    fx.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function spawnConfetti(rect) {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var x = rect ? rect.left + rect.width / 2 : window.innerWidth / 2;
    var y = rect ? rect.top + rect.height / 2 : 140;
    var colors = ['#F2623C', '#E2A93B', '#3E9B6B', '#4A7BE0', '#FF9A5A', '#F4D06F'];
    for (var i = 0; i < 30; i++) {
      particles.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * 8,
        vy: -Math.random() * 8 - 2.5,
        g: 0.24 + Math.random() * 0.1,
        s: 3 + Math.random() * 4.5,
        life: 1,
        rot: Math.random() * 6.28,
        vr: (Math.random() - 0.5) * 0.35,
        color: colors[i % colors.length],
        round: Math.random() < 0.45
      });
    }
    if (!fxRaf) fxRaf = requestAnimationFrame(tickFx);
  }

  function tickFx() {
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    var alive = [];
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.vy += p.g;
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.992;
      p.rot += p.vr;
      p.life -= 0.013;
      if (p.life <= 0 || p.y > window.innerHeight + 40) continue;
      alive.push(p);

      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      if (p.round) {
        ctx.beginPath();
        ctx.arc(0, 0, p.s / 2, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s * 0.55);
      }
      ctx.restore();
    }
    particles = alive;
    if (particles.length) {
      fxRaf = requestAnimationFrame(tickFx);
    } else {
      fxRaf = 0;
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    }
  }

  /* ================= 事件 ================= */
  function bindEvents() {
    document.addEventListener('click', function (e) {
      var actionEl = e.target.closest('[data-action]');
      if (!actionEl) return;
      var action = actionEl.dataset.action;

      if (action === 'toggle') {
        e.preventDefault();
        toggleItem(actionEl.dataset.id, actionEl);
        return;
      }
      if (action === 'edit') {
        openEditor(actionEl.dataset.id);
        return;
      }
      if (action === 'add') {
        openEditor(null);
        return;
      }
      if (action === 'save-item') {
        saveEditor();
        return;
      }
      if (action === 'close-editor') {
        closeSheet(editor);
        return;
      }
      if (action === 'delete-item') {
        deleteEditing();
        return;
      }
      if (action === 'open-settings') {
        selectChip(themeGroup, state.theme);
        showSheet(settingsSheet);
        return;
      }
      if (action === 'close-settings') {
        closeSheet(settingsSheet);
        return;
      }
      if (action === 'toggle-theme') {
        toggleTheme();
        return;
      }
      if (action === 'cycle-sort') {
        cycleSort();
        return;
      }
      if (action === 'toggle-search') {
        toggleSearch();
        return;
      }
      if (action === 'clear-search') {
        if (!state.searchOpen) {
          state.searchOpen = true;
        }
        clearSearch();
        return;
      }
      if (action === 'view') {
        setView(actionEl.dataset.view);
        return;
      }
      if (action === 'category') {
        setCategory(actionEl.dataset.cat);
        return;
      }
      if (action === 'all-category') {
        setCategory('all');
        return;
      }
      if (action === 'suggest') {
        openEditor(null);
        var preset = actionEl.dataset.title || '';
        var presetCat = actionEl.dataset.cat || '';
        setTimeout(function () {
          fTitle.value = preset;
          if (presetCat) selectChip(fCategory, presetCat);
          fTitle.focus({ preventScroll: true });
        }, 60);
        return;
      }
      if (action === 'export') {
        exportData();
        return;
      }
      if (action === 'import') {
        importFile.click();
        return;
      }
      if (action === 'clear-all') {
        clearAll();
        return;
      }
    });

    document.addEventListener('click', function (e) {
      var btn = e.target.closest('[data-group] > button');
      if (!btn) return;
      var groupEl = btn.parentElement;
      var group = groupEl.dataset.group;
      if (group === 'theme') {
        setTheme(btn.dataset.value);
        return;
      }
      var buttons = groupEl.querySelectorAll('button');
      for (var i = 0; i < buttons.length; i++) {
        buttons[i].classList.toggle('active', buttons[i] === btn);
      }
      if (group === 'status') syncProgressVisibility();
      if (group === 'cycle') syncCycleHint();
    });

    searchInput.addEventListener('input', function () {
      state.query = searchInput.value;
      render();
    });

    fProgress.addEventListener('input', updateProgressLabel);

    fTitle.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.isComposing) {
        e.preventDefault();
        saveEditor();
      }
    });

    listEl.addEventListener('keydown', function (e) {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('item-main')) {
        e.preventDefault();
        openEditor(e.target.dataset.id);
      }
    });

    backdrop.addEventListener('click', closeAllSheets);

    importFile.addEventListener('change', function () {
      var file = importFile.files && importFile.files[0];
      importFile.value = '';
      handleImport(file);
    });

    toastBtn.addEventListener('click', function () {
      var fn = toastAction;
      hideToast();
      if (fn) fn();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        if (document.querySelector('.sheet.open')) closeAllSheets();
        else if (state.searchOpen) toggleSearch();
      }
    });

    window.addEventListener('resize', sizeCanvas);

    /* 从后台切回来时，日期和「今天」数量可能已经变了 */
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) {
        setTodayLabel();
        render();
      }
    });

    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onScheme = function () { if (state.theme === 'auto') applyTheme(); };
    if (mq.addEventListener) mq.addEventListener('change', onScheme);
    else if (mq.addListener) mq.addListener(onScheme);
  }

  /* ================= 初始化 ================= */
  function setTodayLabel() {
    var now = new Date();
    todayLabel.textContent = (now.getMonth() + 1) + '月' + now.getDate() + '日 · ' + WEEK[now.getDay()];
  }

  function init() {
    state.items = loadItems();
    state.theme = loadSettings().theme;
    applyTheme();
    setTodayLabel();
    sizeCanvas();
    bindEvents();
    render();
    updateStorageHint();
    syncWithServer();
  }

  init();
})();
</script>
</body>
</html>
